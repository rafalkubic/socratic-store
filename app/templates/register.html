{% extends "base.html" %}
{% block title %}{{ t('register') }} · {{ shop_name }}{% endblock %}
{% block content %}
<section class="auth-shell top-space">
    <div class="auth-card">
        <img class="auth-symbol" src="{{ url_for('static', filename='images/decor/pleroma.png') }}" alt="">
        <p class="eyebrow">ACCOUNT</p>
        <h1>{{ t('register') }}</h1>
        <form method="post" class="stack-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>{{ t('email') }}<input type="email" name="email" required autocomplete="email"></label>
            <label>{{ t('username') }}<input type="text" name="username" minlength="3" maxlength="80" required autocomplete="username"></label>
            <label>{{ t('password') }}<input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
            <label>{{ t('password_repeat') }}<input type="password" name="password_repeat" minlength="8" required autocomplete="new-password"></label>
            <button class="button primary full" type="submit">{{ t('register') }}</button>
        </form>
    </div>
</section>
{% endblock %}
